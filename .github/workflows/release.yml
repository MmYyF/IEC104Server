# ════════════════════════════════════════════════════════════════
#  发版：推一个 v* 标签 → 自动编译单文件 → 建 Release → 附带 update.json
#
#  为什么更新信息要由 CI 生成，而不是手工在网页上填：
#  在线更新要读到「版本号 + 下载地址 + SHA256 + 更新说明」四样东西。
#  人工在 Release 页面里填，等于每次发版都手工维护一份会过期的数据，
#  用几次就会有版本号对不上、哈希漏更新。这里全部从 tag 与
#  docs/CHANGELOG.md 生成，人只负责写 CHANGELOG 和打 tag。
#
#  发布参数（单文件/自包含/压缩/不带 pdb）来自
#  src/IEC104.App/Properties/PublishProfiles/win-x64.pubxml —— 和本地
#  build.bat gui 是同一份定义，不在这里另写一遍。
# ════════════════════════════════════════════════════════════════
name: release

on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手工重跑：workflow_dispatch 时用输入当版本号
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新发布的标签，例如 v1.11.0（必须已存在）'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 发布配置在 pubxml 里，命令行不再重复那些开关
      - name: Publish single-file exe
        run: dotnet publish src/IEC104.App/IEC104.App.csproj -p:PublishProfile=win-x64 -o dist

      # AssemblyName 仍是 IEC104Simulator（avares 资源路径依赖它），
      # 所以产物名要在这里改成界面上显示的名字
      - name: Rename to IEC104-Server.exe
        shell: pwsh
        run: |
          if (-not (Test-Path dist/IEC104Simulator.exe)) { throw 'publish 产物不存在' }
          Move-Item dist/IEC104Simulator.exe dist/IEC104-Server.exe -Force
          # 发布目录只允许一个 exe；多出别的文件说明发布配置被人改过，直接失败
          $extra = Get-ChildItem dist -File | Where-Object { $_.Name -notin @('IEC104-Server.exe') }
          if ($extra) { throw "发布目录混进了多余文件: $($extra.Name -join ', ')" }

      # 逻辑放在 scripts/make-release-manifest.ps1 里，CI 只做调用——
      # 这样同一段生成逻辑能在本机先跑一遍（发版脚本最容易在这里出错，
      # 而它错了要等 tag 推上去、CI 跑完才暴露）。
      - name: Checksum + update.json + release body
        shell: pwsh
        run: |
          ./scripts/make-release-manifest.ps1 `
            -Tag '${{ github.event.inputs.tag || github.ref_name }}' `
            -Repository '${{ github.repository }}' `
            -DistDir dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: dist/RELEASE_BODY.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/IEC104-Server.exe
            dist/IEC104-Server.exe.sha256
            dist/update.json
